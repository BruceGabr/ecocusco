<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EcoCusco - Plataforma inteligente de gestión ambiental y recolección de residuos sólidos segregados">
  <meta name="theme-color" content="#0a1f14">
  <title>EcoCusco - Gestión Ambiental Urbana</title>
  <style>
    body{margin:0;background:#f2efe8;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
    .loading{text-align:center}
    .loading h2{font-size:26px;font-weight:700;color:#1a3a2a;margin:0 0 4px}
    .loading h2 span{color:#c49a30}
    .loading p{font-size:14px;color:#5a6a62;margin:0 0 20px}
    .spinner{width:42px;height:42px;border:3px solid #c0d0c5;border-top-color:#c49a30;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
      <h2>Eco<span>Cusco</span></h2>
      <p>Gestión Ambiental Urbana</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
